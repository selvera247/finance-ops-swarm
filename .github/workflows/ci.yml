name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Pytest (unit + runtime + gui)
        env:
          PYTHONPATH: .
        run: pytest -q --tb=short

      - name: L2 trajectory dry-run (regression gate)
        env:
          PYTHONPATH: .
        run: python evals/run_trajectory_eval.py --dry-run --min-pass-rate 0.8
