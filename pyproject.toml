[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-multi-agent"
version = "0.4.0"
requires-python = ">=3.10"
dependencies = [
  "google-adk>=2.12.0",
  "PyYAML>=6.0.0",
  "python-dotenv>=1.0.0",
  "duckdb>=1.0.0",
  "playwright>=1.40.0",
  "pydantic>=2.0.0",
  "google-cloud-bigquery>=3.0.0",
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "httpx>=0.27.0",
  "mcp>=1.0.0",
]
optional-dependencies = {dev = ["pytest>=8.0.0", "pytest-playwright>=0.4.0"], cloud = ["google-cloud-aiplatform>=1.60.0", "google-cloud-spanner>=3.40.0", "neo4j>=5.0.0"]}

[tool.setuptools.packages.find]
include = ["finance_ops*", "data_plane*", "pipelines*", "gui_connectors*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
